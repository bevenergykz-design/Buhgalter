# Nginx для «Диалог Учёт». __DOMAIN__ подставляет setup-vps.sh, HTTPS добавляет certbot.
# Общие настройки прокси — в /etc/nginx/snippets/dialog-uchet-proxy.conf (копия deploy/nginx-proxy.conf).

# Основной сайт
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    include /etc/nginx/snippets/dialog-uchet-proxy.conf;
}

# Вход по IP-адресу сервера — для проверки до переключения домена. Поисковикам закрыт.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/dialog-uchet-proxy.conf;
}
